name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Run on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting Deployment on EC2 Server..."
            
            # 1. Navigate to project folder or clone if first time
            if [ ! -d "$HOME/SimpleDevOps" ]; then
              echo "Cloning repository for the first time..."
              git clone https://github.com/${{ github.repository }}.git $HOME/SimpleDevOps
            fi
            
            cd $HOME/SimpleDevOps
            
            # 2. Fetch latest changes from main branch
            echo "Pulling latest code from GitHub..."
            git reset --hard
            git pull origin main
            
            # 3. Build Docker image directly on EC2
            echo "Building Docker image on EC2..."
            docker build -t simple-devops-app .
            
            # 4. Stop and remove existing container if running
            echo "Stopping old container..."
            docker stop simple-devops-app || true
            docker rm simple-devops-app || true
            
            # 5. Run new container on port 80
            echo "Launching updated container on Port 80..."
            docker run -d --name simple-devops-app -p 80:80 --restart unless-stopped simple-devops-app
            
            # 6. Verify container status
            docker ps --filter "name=simple-devops-app"
            echo "Deployment finished successfully."
